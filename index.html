<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  font-family: system-ui, -apple-system;
  background:#f6f6f6;
  margin:0;
}

header{
  padding:15px;
  background:#0a2a66;
  color:white;
  text-align:center;
  font-size:20px;
}

#total{
  padding:15px;
  font-weight:bold;
}

.producto{
  display:flex;
  gap:10px;
  padding:10px;
  background:white;
  margin:10px;
  border-radius:10px;
}

.fab{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#0a2a66;
  color:white;
  border-radius:50%;
  width:55px;
  height:55px;
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<header>Mi Wishlist</header>

<div id="total">Total: $0</div>

<div id="lista"></div>

<div class="fab" onclick="agregar()">+</div>

<script>
let lista = JSON.parse(localStorage.getItem("wishlist") || "[]");
render();

function agregar(){
  const nombre = prompt("Nombre del producto");
  const tienda = prompt("Tienda");
  const precio = Number(prompt("Precio"));
  const url = prompt("Link del producto");

  lista.push({nombre, tienda, precio, url});
  localStorage.setItem("wishlist", JSON.stringify(lista));
  render();
}

function eliminar(i){
  lista.splice(i,1);
  localStorage.setItem("wishlist", JSON.stringify(lista));
  render();
}

function render(){
  const div = document.getElementById("lista");
  div.innerHTML = "";
  let total = 0;

  lista.forEach((p,i)=>{
    total += p.precio;

    div.innerHTML += `
      <div class="producto">
        <div onclick='window.open("${p.url}")'>📦 ${p.nombre}<br>
        🏬 ${p.tienda}<br>
        💵 $${p.precio}</div>
        <button onclick="eliminar(${i})">Eliminar</button>
      </div>
    `;
  });

  document.getElementById("total").innerText = "Total: $" + total;
}
</script>

</body>
</html>
